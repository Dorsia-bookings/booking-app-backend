services:
  - type: web
    name: restaurant-booking-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: restaurant-booking-db
    plan: starter
    databaseName: restaurant_booking
    user: booking_user
